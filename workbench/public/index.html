<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目经验库</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">EXP</span>
      <div>
        <strong>项目经验库</strong>
        <span id="workspace" class="workspace"></span>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">/</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜现象、报错、命令、路径…" />
      <span id="search-count" class="search-count"></span>
    </div>
    <div class="top-actions">
      <button id="inbox-btn" class="btn ghost" title="收件箱：先记一行，稍后整理成卡">收件箱</button>
      <button id="audit-btn" class="btn ghost" title="审计：检查当前项目的 P0/P1 问题">审计</button>
      <button id="new-btn" class="btn primary" title="新建经验卡（快捷键 N）">新建卡片 <kbd>N</kbd></button>
    </div>
  </header>

  <div class="project-bar">
    <span class="project-label">当前项目</span>
    <select id="project-select" class="select" aria-label="切换项目"></select>
    <span id="project-path" class="project-path"></span>
    <span class="project-note">每个项目只读自己的 procedures/</span>
  </div>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="stat" id="stat"></div>
        <select id="layer-filter" class="select" aria-label="按复核层筛选">
          <option value="">全部复核层</option>
          <option value="fixed">fixed · 原理稳定</option>
          <option value="env">env · 环境/版本</option>
          <option value="task">task · 任务型</option>
        </select>
      </div>
      <div id="list" class="list"></div>
      <div id="list-empty" class="list-empty hidden">没有匹配的卡片</div>
    </aside>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical"
      aria-label="拖动调整左栏宽度" aria-valuemin="280" aria-valuemax="900"
      aria-valuenow="400" tabindex="0" title="拖动调整左右占比；双击复位"></div>

    <section class="detail">
      <div id="welcome" class="welcome">
        <div class="welcome-kicker">LOCAL EXPERIENCE LIBRARY</div>
        <h1>把踩过的坑，留在项目里。</h1>
        <p>从左边选一张卡，或按 <kbd>N</kbd> 新建。搜索会匹配文件名、触发行和正文。</p>
        <div class="welcome-shortcuts">
          <span><kbd>/</kbd> 搜索</span>
          <span><kbd>N</kbd> 新建</span>
          <span><kbd>E</kbd> 编辑</span>
          <span><kbd>⌘/Ctrl</kbd> + <kbd>S</kbd> 保存</span>
        </div>
      </div>

      <article id="card" class="card hidden">
        <div class="card-head">
          <div>
            <div id="card-badges" class="badges"></div>
            <h1 id="card-title"></h1>
            <div id="card-path" class="path"></div>
          </div>
          <div class="card-actions">
            <button id="copy-btn" class="btn ghost small">复制路径</button>
            <button id="edit-btn" class="btn ghost small">编辑 <kbd>E</kbd></button>
          </div>
        </div>
        <div id="card-meta" class="meta-row"></div>
        <div id="draft-banner" class="draft-banner hidden">
          <span>这张卡有一份未保存的草稿。</span>
          <button id="restore-draft" class="btn small ghost">恢复草稿</button>
          <button id="discard-draft" class="btn small ghost">丢弃</button>
        </div>
        <div id="card-preview" class="markdown"></div>
        <div id="edit-wrap" class="edit-wrap hidden">
          <textarea id="editor" spellcheck="false"></textarea>
          <div class="edit-actions">
            <span id="dirty" class="dirty"></span>
            <button id="cancel-btn" class="btn ghost">取消</button>
            <button id="save-btn" class="btn primary">保存 <kbd>⌘/Ctrl S</kbd></button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <aside id="audit-panel" class="drawer hidden">
    <div class="drawer-head">
      <div>
        <strong>审计</strong>
        <span id="audit-sub" class="muted"></span>
      </div>
      <button id="audit-close" class="icon-btn" aria-label="关闭">×</button>
    </div>
    <div id="audit-body" class="drawer-body"></div>
  </aside>

  <aside id="inbox-panel" class="drawer hidden">
    <div class="drawer-head">
      <div>
        <strong>收件箱</strong>
        <span class="muted">先记一行，稍后整理</span>
      </div>
      <button id="inbox-close" class="icon-btn" aria-label="关闭">×</button>
    </div>
    <div class="drawer-body">
      <div class="inbox-compose">
        <input id="inbox-input" type="text" placeholder="这次踩到的现象，一行…" />
        <button id="inbox-add" class="btn primary">记下</button>
      </div>
      <div id="inbox-list" class="inbox-list"></div>
    </div>
  </aside>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <strong>新建经验卡</strong>
          <span class="muted">写现象，不写主题</span>
        </div>
        <button id="modal-close" class="icon-btn" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>文件名</span>
          <input id="new-file" type="text" placeholder="分类-现象，例如 抓取-网页空壳" />
        </label>
        <label class="field">
          <span>触发现象 <em>必填</em></span>
          <input id="new-trigger" type="text" placeholder="任务描述里真的会出现的词" />
        </label>
        <label class="field">
          <span>复核层 <em>决定什么时候要重看</em></span>
          <select id="new-layer" class="select">
            <option value="">暂不设复核层</option>
            <option value="fixed">fixed — 原理稳定，长期不变</option>
            <option value="env">env — 换环境/版本/路径要复核</option>
            <option value="task">task — 只对当前任务成立</option>
          </select>
          <small class="field-hint">fixed=原理；env=环境；task=任务。拿不准选 env。</small>
        </label>
        <label class="field">
          <span>首选做法</span>
          <textarea id="new-preferred" rows="2" placeholder="可直接复制的命令 / 参数 / 路径"></textarea>
        </label>
        <label class="field">
          <span>被挡时的兜底</span>
          <textarea id="new-fallback" rows="2" placeholder="1–2 条，按方便程度排"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>试过不通的弯路</span>
            <input id="new-deadend" type="text" placeholder="真试过并失败的" />
          </label>
          <label class="field">
            <span>为什么不通</span>
            <input id="new-why" type="text" placeholder="报错原文 / 原因" />
          </label>
        </div>
        <label class="field">
          <span>验证方式</span>
          <input id="new-verification" type="text" placeholder="怎么确认这次真的成了" />
        </label>
        <label class="field">
          <span>证据</span>
          <input id="new-evidence" type="text" placeholder="会话 id / commit / 文件路径" />
        </label>
        <div id="new-error" class="form-error hidden"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn ghost">取消</button>
        <button id="modal-create" class="btn primary">创建卡片</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
