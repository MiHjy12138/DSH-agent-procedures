function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
let sizingContext={},inlineSizeReported=false;
function applyHostSize(context={}){const previousMode=sizingContext.displayMode||'inline';if(context.displayMode&&context.displayMode!==previousMode&&!Object.hasOwn(context,'containerDimensions'))delete sizingContext.containerDimensions;sizingContext={...sizingContext,...context};const bound=sizingContext.containerDimensions?.maxHeight;const bounded=typeof bound==='number'&&Number.isFinite(bound)&&bound>0;const mode=sizingContext.displayMode||'inline';document.body.dataset.displayMode=mode;document.body.style.height=bounded?bound+'px':mode==='inline'?'560px':'100%';if(bounded||mode!=='inline')inlineSizeReported=false;else if(ready&&!inlineSizeReported){notify('ui/notifications/size-changed',{height:560});inlineSizeReported=true;}}
function hostContext(context){applyHostSize(context);if(typeof context?.locale==='string'){hostLocale=context.locale;language=normalizeLocale(hostLocale);applyLanguage();if(ready)load();}}
function request(method,params={}){if(parent===window)return Promise.reject(new Error(t('native_wait')));const id=++sequence;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error(t('host_timeout')));},15000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function notify(method,params={}){if(parent!==window)parent.postMessage({jsonrpc:'2.0',method,params},'*');}
async function call(name,args={}){if(!capabilities.serverTools)throw new Error(t('no_tools'));const result=await request('tools/call',{name:'procedure_library_'+name,arguments:args});if(result.isError)throw new Error((result.content?.map(x=>x.text||'').join('\n')==='PROJECT_LIBRARY_MISSING'?t('manual_missing'):result.content?.map(x=>x.text||'').join('\n'))||t('action_failed'));return result.structuredContent||JSON.parse(result.content.find(x=>x.type==='text').text);}
function context(){return {library,...(selectedProject?{projectPath:selectedProject}:{})};}
function empty(message,title=t('empty')){$('initialize').classList.add('hide');selected=null;$('delete').disabled=true;$('title').textContent=title;$('filename').textContent=t('read_guide');$('content').textContent=message;$('empty-logo').classList.remove('hide');}
async function load(){if(!ready)return;$('initialize').classList.add('hide');const version=++loadVersion;++readVersion;selected=null;$('delete').disabled=true;$('central').setAttribute('aria-selected',library==='central');$('project').setAttribute('aria-selected',library==='project');if(library==='project'&&!selectedProject){cards=[];$('cards').replaceChildren();$('count').textContent=t('cards')+' 0';$('path').textContent='';empty(t('select_guide'));return;}try{const result=await call('list',{...context(),query:$('search').value});if(version!==loadVersion)return;cards=result.cards;$('cards').replaceChildren();$('count').textContent=t('cards')+' '+cards.length;$('path').textContent=result.path;for(const card of cards){const button=document.createElement('button');button.className='card';button.textContent=card.title;button.title=card.name;button.onclick=()=>selectCard(card,button);$('cards').append(button);}if(cards.length)await selectCard(cards[0],$('cards').firstChild);else if(result.exists&&$('search').value.trim())empty(t('search_guide'),t('no_matches'));else empty(result.exists?t('empty'):t(selectionSource==='thread'?'source_library_missing':'uninitialized',{path:result.path,project:sourceProject?.label||selectedProject}));if(!result.exists&&library==='project'&&selectionSource==='thread'&&sourceProject?.path===selectedProject){$('title').textContent=t('current_library_missing');$('initialize').classList.remove('hide');}status(t('card_count',{shown:cards.length,total:result.total||0})+' · '+t(library==='central'?'personal_methods':selectionSource==='thread'?'source_project':'manual_project',{project:sourceProject?.label||''}));}catch(error){empty(error.message);status(error.message,true);}}
async function selectCard(card,button){const version=++readVersion;selected={...card,...context()};document.querySelectorAll('.card').forEach(node=>node.setAttribute('aria-current',node===button));$('title').textContent=card.title;$('filename').textContent=card.name;$('empty-logo').classList.add('hide');$('delete').disabled=true;try{const result=await call('read',{...context(),name:card.name,expectedPath:card.path});if(version!==readVersion)return;$('content').textContent=result.text;$('delete').disabled=false;}catch(error){if(version===readVersion){$('content').textContent=error.message;status(error.message,true);}}}
function populateProjects(data){$('projects').replaceChildren();const prompt=document.createElement('option');prompt.value='';prompt.textContent=t('choose_project');$('projects').append(prompt);for(const item of data.projects){const option=document.createElement('option');option.value=item.path;option.textContent=item.label+' — '+item.path;$('projects').append(option);}currentSourceProject=data.sourceProject;sourceProject=data.sourceProject;selectionSource=data.selectionSource;selectedProject=data.selectedProject;const listed=data.projects.some(x=>x.path===selectedProject);$('projects').value=listed?selectedProject:'';if(selectionSource==='thread'&&sourceProject&&!sourceProject.hasLibrary)prompt.textContent=t('source_missing_option',{project:sourceProject.label});}
async function refreshState(){if(!ready)return;const previous={path:selectedProject,source:selectionSource,project:sourceProject};try{const data=await call('state');populateProjects(data);if(previous.source==='manual'&&data.projects.some(item=>item.path===previous.path)){selectedProject=previous.path;selectionSource='manual';sourceProject=null;$('projects').value=selectedProject;}await load();}catch(error){status(error.message,true);}}
async function chooseProject(path){try{if(currentSourceProject?.path===path&&!currentSourceProject.hasLibrary){selectedProject=path;selectionSource='thread';sourceProject=currentSourceProject;$('projects').value=path;library='project';$('project-dialog').close();await load();return;}const result=await call('select_project',{projectPath:path});selectedProject=result.selectedProject;selectionSource='manual';sourceProject=null;const prompt=$('projects').querySelector('option[value=""]');if(prompt)prompt.textContent=t('choose_project');if(!Array.from($('projects').options).some(x=>x.value===selectedProject)){const option=document.createElement('option');option.value=selectedProject;option.textContent=selectedProject;$('projects').append(option);}$('projects').value=selectedProject;library='project';$('project-dialog').close();await load();}catch(error){status(error.message,true);}}
$('central').onclick=()=>{library='central';load();};$('project').onclick=()=>{library='project';load();};$('refresh').onclick=refreshState;$('initialize').onclick=async()=>{const button=$('initialize');button.disabled=true;try{await call('initialize',{projectPath:selectedProject,expectedPath:$('path').textContent});await refreshState();}catch(error){status(error.message,true);}finally{button.disabled=false;}};$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,180);};$('projects').onchange=()=>{if($('projects').value)chooseProject($('projects').value);};$('manual').onclick=()=>{$('project-path').value=selectedProject||'';$('project-dialog').showModal();$('cancel-project').focus();};$('cancel-project').onclick=()=>$('project-dialog').close();$('save-project').onclick=()=>chooseProject($('project-path').value.trim());$('folder').onclick=async()=>{try{await call('open_folder',context());}catch(error){status(error.message,true);}};
let deletion=null;
$('delete').onclick=()=>{if(!selected)return;deletion={...selected};$('confirm-text').textContent=t('delete_confirm',{library:t(library==='central'?'central':'selected_library'),name:deletion.name,path:deletion.path});$('confirm').showModal();$('cancel-delete').focus();};$('cancel-delete').onclick=()=>{deletion=null;$('confirm').close();status(t('delete_cancelled'));};$('confirm').addEventListener('cancel',()=>{deletion=null;});$('confirm-delete').onclick=async()=>{if(!deletion)return;const target=deletion;deletion=null;$('confirm-delete').disabled=true;try{await call('recycle',{library:target.library,...(target.projectPath?{projectPath:target.projectPath}:{}),name:target.name,expectedPath:target.path});$('confirm').close();await load();status(t('recycled',{name:target.name,total:cards.length}));}catch(error){$('confirm').close();status(error.message,true);}finally{$('confirm-delete').disabled=false;}};
window.addEventListener('keydown',event=>{if(event.ctrlKey&&event.key.toLowerCase()==='f'){event.preventDefault();$('search').focus();}});
window.addEventListener('message',event=>{if(event.source!==parent)return;const data=event.data;if(data?.jsonrpc!=='2.0')return;if(data.id!==undefined&&(data.result!==undefined||data.error)){const item=pending.get(data.id);if(!item)return;clearTimeout(item.timer);pending.delete(data.id);data.error?item.reject(new Error(data.error.message)):item.resolve(data.result);return;}if(data.method==='ui/notifications/host-context-changed'){hostContext(data.params);}if(data.method==='ping'&&data.id!==undefined)parent.postMessage({jsonrpc:'2.0',id:data.id,result:{}},'*');if(data.method==='ui/resource-teardown'){clearTimeout(searchTimer);ready=false;for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error(t('native_wait')));}pending.clear();if(data.id!==undefined)parent.postMessage({jsonrpc:'2.0',id:data.id,result:{}},'*');}});
async function connect(){try{const initialized=await request('ui/initialize',{appInfo:{name:'procedure-library',version:'0.1.7'},appCapabilities:{tools:{listChanged:false},availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});capabilities=initialized.hostCapabilities||{};hostContext(initialized.hostContext);notify('ui/notifications/initialized');if(!capabilities.serverTools)throw new Error(t('no_tools'));const data=await call('state');if(!hostLocale){language=(data.langid&1023)===4?([1,3,5].includes(data.langid>>10)?'zh-TW':'zh-CN'):'en';applyLanguage();}populateProjects(data);if(selectionSource==='thread')library='project';ready=true;await load();applyHostSize();}catch(error){empty(t('native_wait'));status(error.message,true);}}
$('brand-logo').innerHTML=LOGO;$('empty-logo').innerHTML=LOGO;applyLanguage();empty(t('native_wait'));connect();
</script></body></html>
